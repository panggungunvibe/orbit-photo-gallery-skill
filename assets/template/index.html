<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="可交互的旅行照片相册，拖动旋转、滚动缩放，也可以用手势探索。" />
  <title>旅途相册</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <main id="app">
    <header class="masthead"><h1>旅途相册</h1><span class="masthead-rule"></span></header>
    <div class="gesture-controls">
      <button id="gesture-toggle" class="gesture-toggle" aria-pressed="false" aria-controls="camera-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11m0-5.5V4a1.5 1.5 0 0 1 3 0v7m0-5a1.5 1.5 0 0 1 3 0v6m0-3a1.5 1.5 0 0 1 3 0v6c0 4-2.5 6-6 6h-1c-2.5 0-4-1.5-5.5-3.5L4 13a1.5 1.5 0 0 1 2.2-2L8 13"/></svg><span>开启手势控制</span></button>
      <section id="camera-panel" class="camera-panel" hidden aria-label="手势摄像头">
        <div class="camera-preview"><video id="camera-video" playsinline muted></video><canvas id="hand-overlay" width="480" height="360" aria-hidden="true"></canvas><span class="camera-live"><i></i> HAND TRACKING</span></div>
        <div class="camera-caption"><span id="camera-status" role="status">正在准备摄像头…</span><button id="gesture-help-toggle" aria-label="手势操作说明" aria-expanded="false" aria-controls="gesture-help">?</button></div>
        <div id="gesture-help" class="gesture-help" hidden><p>🖐 手掌左右移动，旋转圆环或滑动长卷</p><p>☝ 食指指向照片或返回按钮，停留即可选中</p><p>🤲 双手拉开或靠近，调整大小</p><p>手势识别在本机运行，关闭即停止摄像头。</p></div>
      </section>
      <p id="camera-error" class="camera-error" role="status" hidden></p>
    </div>
    <section id="gallery" class="gallery" aria-label="环形作品画廊" aria-roledescription="carousel" tabindex="0" aria-describedby="gallery-instructions">
      <div class="stage" id="stage"><div class="ring" id="ring"></div></div>
      <div class="floor-shadow" aria-hidden="true"></div>
    </section>
    <nav id="category-nav" class="category-nav" aria-label="照片分类"></nav>
    <section id="collection" class="collection" hidden aria-labelledby="collection-title"><header class="collection-heading"><button id="collection-back" data-hand-action="back" class="text-button">← 回到圆环</button><div><h2 id="collection-title"></h2><p id="collection-note"></p></div><span id="collection-count"></span></header><div id="photo-scroll" class="photo-scroll" tabindex="0" aria-label="分类照片长卷"></div><div id="scroll-progress" class="scroll-progress"></div><p class="collection-hint">左右拖动，或张开手掌左右移动 · 点击照片读日记</p></section>
    <div id="detail-backdrop" class="detail-backdrop" hidden></div>
    <aside id="detail" class="detail" role="dialog" aria-labelledby="detail-title" hidden>
      <button id="detail-close" data-hand-action="close" class="detail-close" aria-label="关闭作品详情">×</button>
      <img id="detail-image" alt="" />
      <div class="detail-copy"><div class="detail-heading"><h2 id="detail-title"></h2><span id="detail-year"></span></div><p id="detail-category" class="detail-category"></p><p id="detail-description" class="detail-description"></p></div>
    </aside>
    <footer class="footer"><p id="gallery-instructions" class="instructions"><span class="desktop-instructions">Drag to orbit · Scroll to zoom · Click a card to open</span><span class="touch-instructions">Swipe to orbit · Pinch to zoom · Tap a card</span><span id="hand-hint" hidden> · Or just use your hand</span></p></footer>
    <button id="sound-toggle" class="sound-toggle" aria-label="开启环境音" aria-pressed="false" title="开启环境音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg></button>
    <div id="hand-cursor" class="hand-cursor" hidden aria-hidden="true"><svg viewBox="0 0 40 40"><circle class="cursor-track" cx="20" cy="20" r="16"/><circle class="cursor-progress" cx="20" cy="20" r="16"/></svg><i></i></div>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
